name: dbt CI

on:
  pull_request:

permissions:
  contents: read # Explicitly grant read permission for the checkout action

jobs:
  linter-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-duckdb sqlfluff sqlfluff-templater-dbt

      - name: Check SQLFluff version
        run: sqlfluff --version

      - name: Lint SQL with SQLFluff
        run: sqlfluff lint models/ --dialect duckdb --ignore templating

  dbt-ci:
    runs-on: ubuntu-latest
    needs: [linter-check]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb

      - name: Generate profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          dbt_semantic_prep:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: ./duckdb_ci.duckdb
                schema: dbt_semantic_ci
                threads: 4
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt debug
        run: dbt debug

      - name: dbt seed
        run: dbt seed

      # local CI can't generate upstream modified models
      - name: dbt build
        run: |
          dbt build

      - name: Upload artifacts for Slim CI caching
        uses: actions/upload-artifact@v4
        with:
          name: dbt-state
          path: target
